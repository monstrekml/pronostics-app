# Mise à jour automatique des données, gratuite pour un dépôt public.
# - tous les jours à 06h00 et 18h00 UTC : nouveaux résultats + calendrier (foot et NBA)
# - le lundi : on relance aussi le backtest (onglet « Fiabilité »)
# - lancement manuel possible : onglet Actions > « Mise à jour des données » > Run workflow
#
# Chaque commit sur la branche principale fait redémarrer l'app Streamlit Community Cloud,
# qui affiche alors les nouvelles données.

name: Mise à jour des données

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Relancer aussi le backtest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

      - name: Récupérer les nouvelles données
        env:
          # Facultatif : clé gratuite football-data.org (Settings > Secrets and variables > Actions)
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/mise_a_jour.py

      - name: Backtest (le lundi matin, ou à la demande)
        if: ${{ github.event.inputs.backtest == 'true' || github.event.schedule == '0 6 * * *' }}
        run: |
          if [ "${{ github.event.inputs.backtest }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            python scripts/backtest.py
          else
            echo "Pas de backtest aujourd'hui."
          fi

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data resultats
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Données mises à jour le $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
